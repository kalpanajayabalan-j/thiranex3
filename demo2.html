<!DOCTYPE html>
<html>
<head>
    <title>Weather Dashboard</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #eaf6ff;
            padding: 40px;
        }

        .box {
            background: white;
            padding: 25px;
            width: 350px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            padding: 10px;
            width: 200px;
        }

        button {
            padding: 10px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        #weather {
            margin-top: 20px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <div class="box">
        <h2>Weather Dashboard</h2>

        <input type="text" id="city" placeholder="Enter city name">
        <button onclick="getWeather()">Search</button>

        <div id="weather"></div>
    </div>

    <script>
        async function getWeather() {

            let city = document.getElementById("city").value;
            let result = document.getElementById("weather");

            if (city == "") {
                result.innerHTML = "Please enter a city name";
                return;
            }

            try {

                // Find city latitude and longitude
                let geoResponse = await fetch(
                    `https://geocoding-api.open-meteo.com/v1/search?name=${city}&count=1`
                );

                let geoData = await geoResponse.json();

                if (!geoData.results) {
                    result.innerHTML = "City not found";
                    return;
                }

                let latitude = geoData.results[0].latitude;
                let longitude = geoData.results[0].longitude;
                let cityName = geoData.results[0].name;

                // Get weather data
                let weatherResponse = await fetch(
                    `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,wind_speed_10m`
                );

                let weatherData = await weatherResponse.json();

                // Display data
                result.innerHTML = `
                    <h3>${cityName}</h3>
                    🌡️ Temperature: ${weatherData.current.temperature_2m} °C <br>
                    💧 Humidity: ${weatherData.current.relative_humidity_2m}% <br>
                    💨 Wind Speed: ${weatherData.current.wind_speed_10m} km/h
                `;

            } catch (error) {

                result.innerHTML = "Error fetching weather data";

                console.log(error);
            }
        }
    </script>

</body>
</html>
